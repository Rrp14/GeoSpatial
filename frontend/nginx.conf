server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 26m;
    error_page 413 = @upload_limit;
    location @upload_limit {
        default_type application/json;
        return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"Request exceeds the upload limit.","details":null}}';
    }
    location /api/ { proxy_pass http://api:8000; proxy_read_timeout 300s; proxy_send_timeout 300s; }
    location /docs { proxy_pass http://api:8000; }
    location /openapi.json { proxy_pass http://api:8000; }
    location /health { proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
}

# Publish API access through the edge container; the parser stays on an
# internal-only network without outbound internet access.
server {
    listen 8000;
    client_max_body_size 26m;
    error_page 413 = @upload_limit;
    location @upload_limit {
        default_type application/json;
        return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"Request exceeds the upload limit.","details":null}}';
    }
    location / {
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Development console, bound to localhost by Compose.
server {
    listen 9001;
    location / {
        proxy_pass http://minio:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
